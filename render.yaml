services:
  - type: web
    name: iot-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free # Change to starter/pro if needed
    envVars:
      - key: APP_NAME
        value: "IoT Dashboard"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        # Render will automatically provide its host, but you can override this if you use a custom domain.
        value: "https://iot-backend.onrender.com"
        
      # Fix Apache Port Mapping
      - key: PORT
        value: "80"
      
      # Frontend URL for CORS and Sanctum
      - key: FRONTEND_URL
        value: "https://io-t-device-dashboard-for-smart-hom.vercel.app"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "io-t-device-dashboard-for-smart-hom.vercel.app"
      - key: SESSION_DOMAIN
        value: ".onrender.com" # Required for cookies across domains if using the default Render URL
      
      # Database Configuration (Supabase PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Add your Supabase Host here in the Render Dashboard
      - key: DB_PORT
        value: "6543" # Default Supabase Pooler Port (or 5432)
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false # Add your Supabase Username here
      - key: DB_PASSWORD
        sync: false # Add your Supabase Password here
